spring:
  application:
    name: banhang-backend
  profiles:
    default: dev
  config:
    # Khi chạy trên máy: đọc mật khẩu và khóa từ deploy/.env (file này không commit).
    import: "optional:file:../deploy/.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_HOST_PORT:5432}/banhang}
    username: app_backend            # không có BYPASSRLS (AD-5)
    password: ${DB_BACKEND_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    url: ${spring.datasource.url}   # DDL vào primary, kể cả khi bật DataSource chọn replica.
    user: app_owner                  # chỉ Flyway được chạy DDL (AD-4)
    password: ${DB_OWNER_PASSWORD:}
    schemas: app,ai
    default-schema: app
    create-schemas: false
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: app
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true                  # AD-19
  servlet:
    multipart:
      # Chỉ ảnh Sản phẩm nhận tệp, tối đa 1 MB: ProductImageService kiểm và trả 413 /errors/catalog/image-too-large.
      # Giới hạn của Tomcat để cao hơn một chút, nên ảnh lố cỡ vẫn tới được controller và nhận đúng mã đó; lố cả giới
      # hạn này thì ApiExceptionHandler trả 413 /errors/common/payload-too-large. nginx nhận tới 10 MB.
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Body lố max-request-size bị từ chối trước khi đọc hết; Tomcat đọc bỏ phần còn lại tới giới hạn này rồi mới trả
    # 413, quá thì đóng kết nối (client thấy lỗi kết nối). Để bằng client_max_body_size của nginx (10 MB).
    max-swallow-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  backoffice:
    queue:
      publish-enabled: ${APP_BACKOFFICE_QUEUE_PUBLISH_ENABLED:false}
      consume-enabled: ${APP_BACKOFFICE_QUEUE_CONSUME_ENABLED:false}
      file-consume-enabled: ${APP_BACKOFFICE_QUEUE_FILE_CONSUME_ENABLED:false}
      topic: ${APP_BACKOFFICE_QUEUE_TOPIC:backoffice.write-commands.v1}
      file-topic: ${APP_BACKOFFICE_QUEUE_FILE_TOPIC:backoffice.file-commands.v1}
      consumer-group: ${APP_BACKOFFICE_QUEUE_CONSUMER_GROUP:backoffice-write-worker-v1}
      file-consumer-group: ${APP_BACKOFFICE_QUEUE_FILE_CONSUMER_GROUP:backoffice-file-worker-v1}
      publish-timeout-ms: ${APP_BACKOFFICE_QUEUE_PUBLISH_TIMEOUT_MS:10000}
    files:
      directory: ${APP_BACKOFFICE_FILES_DIRECTORY:./var/import-files}
      max-total-bytes: ${APP_BACKOFFICE_FILES_MAX_TOTAL_BYTES:268435456}
      ttl: ${APP_BACKOFFICE_FILES_TTL:P7D}
  security:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: 8h                    # AD-9: exp = lúc cấp + 8 giờ
    renew-after: 15m                 # AD-9: cấp token mới khi cũ hơn 15 phút
    account-status-cache: 60s        # AD-9: kiểm tra trạng thái tài khoản, cache tối đa 60 giây
    cookie-secure: false             # demo chạy http://localhost
    internal-service-key: ${INTERNAL_SERVICE_KEY:}
  catalog:
    sync-datasource:                 # datasource thứ hai, chỉ change-feed dùng (AD-5 mục 6, AD-12); chỉ đọc, pool tối đa 2
      url: ${spring.datasource.url}  # cùng database với datasource chính
      username: sync_reader          # BYPASSRLS, chỉ SELECT product, product_variant, category, view catalog_product_changes
      password: ${DB_SYNC_PASSWORD:}
  dev:
    password: demo1234               # mật khẩu tài khoản dev.* (chỉ profile dev)
  seed:
    dir: ${SEED_DIR:../deploy/seed}
    anchor-date: ${SEED_ANCHOR_DATE:}

logging:
  level:
    vn.nhom17: INFO

---
spring:
  config:
    activate:
      on-profile: seed
  main:
    web-application-type: none       # job seed chạy xong thì thoát

---
spring:
  config:
    activate:
      on-profile: demo
logging:
  structured:
    format:
      console: ecs                   # log JSON ra stdout khi chạy bằng Docker
