# Chạy toàn hệ thống (AD-1): đúng 4 container web, backend, ai-service, db; cùng một mạng nội bộ.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Chỉ database khi phát triển:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d db
# Chủ: Hiếu.
name: banhang

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: banhang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong deploy/.env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_BACKEND_PASSWORD: ${DB_BACKEND_PASSWORD:?}
      DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?}
      DB_AI_PASSWORD: ${DB_AI_PASSWORD:?}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banhang"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    image: banhang-backend:latest
    environment:
      DB_URL: jdbc:postgresql://db:5432/banhang
      DB_BACKEND_PASSWORD: ${DB_BACKEND_PASSWORD:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?}
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILES:-demo}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai-service:
    build: ../ai-service
    environment:
      DATABASE_URL: postgresql://ai_service:${DB_AI_PASSWORD:?}@db:5432/banhang
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      BACKEND_URL: http://backend:8080
      SYNC_ENABLED: ${AI_SYNC_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    # Không depends_on ai-service: nginx vẫn chạy khi dịch vụ AI tắt (AD-1).
    depends_on:
      - backend

  # Job nạp dữ liệu mẫu (AD-18), chỉ chạy khi gọi: docker compose ... run --rm seed
  seed:
    image: banhang-backend:latest   # dùng lại image của backend (build cùng lúc với backend)
    profiles: ["tools"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/banhang
      DB_BACKEND_PASSWORD: ${DB_BACKEND_PASSWORD:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_SYNC_PASSWORD: ${DB_SYNC_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?}
      SPRING_PROFILES_ACTIVE: seed
      SEED_ANCHOR_DATE: ${SEED_ANCHOR_DATE:-}
      SEED_DIR: /seed
    volumes:
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
