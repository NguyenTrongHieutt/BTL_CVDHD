scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: [pg-exporter-primary:9187]
        labels: { db_node: primary }
      - targets: [pg-exporter-replica-1:9187]
        labels: { db_node: replica-1 }
      - targets: [pg-exporter-replica-2:9187]
        labels: { db_node: replica-2 }
      - targets: [pg-exporter-warehouse:9187]
        labels: { db_node: warehouse }

  - job_name: infra-metrics
    static_configs:
      - targets: [infra-metrics:9198]

  - job_name: container-metrics
    metrics_path: /metrics.txt
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: [container-metrics-exporter:9101]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
