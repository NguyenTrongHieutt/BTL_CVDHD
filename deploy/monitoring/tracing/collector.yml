receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  transform/remove_sensitive:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "messaging.kafka.message.key")
          - delete_matching_keys(attributes, "^(http\\.(request|response)\\.header\\.|db\\.query\\.parameter\\.|messaging\\.header\\.)")
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 32
    retry_on_failure:
      max_elapsed_time: 30s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/remove_sensitive, batch]
      exporters: [otlp_grpc/tempo]
