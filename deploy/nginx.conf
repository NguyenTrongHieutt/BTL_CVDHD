# nginx của container web (AD-1). Chủ: Hiếu.
#   /      → SPA React (đã build vào image)
#   /api/  → backend
#   /ai/   → ai-service (phân giải lúc chạy, nên nginx vẫn lên khi ai-service tắt)
#   /internal/* và db: không mở ra ngoài
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # X-Request-Id: giữ của client nếu có, không thì nginx tự sinh
    set $req_id $http_x_request_id;
    if ($req_id = "") { set $req_id $request_id; }
    add_header X-Request-Id $req_id always;

    client_max_body_size 10m;

    location /internal/ {
        return 404;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ai/ {
        set $ai_upstream http://ai-service:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;            # AD-11: hỏi đáp tối đa 10 giây
        proxy_intercept_errors on;
        error_page 502 503 504 = @ai_unavailable;
    }

    location @ai_unavailable {
        default_type application/problem+json;
        add_header X-Request-Id $req_id always;
        return 503 '{"type":"/errors/ai/unavailable","title":"Dịch vụ AI chưa sẵn sàng","status":503,"detail":"Tạm thời không dùng được Trợ lý AI và Tìm kiếm ngữ nghĩa. Màn hình bán hàng tự chuyển sang Tìm kiếm thường.","requestId":"$req_id"}';
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
